!
version 15.4
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec localtime show-timezone year
service timestamps log datetime msec localtime show-timezone year
service password-encryption
service sequence-numbers
!
hostname R19
!
boot-start-marker
boot-end-marker
!
!
enable secret 8 $8$2iGDqHGE/MoyHa$Zc9lwjD1Zx3e31bxVVbwHANjL5Wr908n8cIseTegs6.
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
no ip domain lookup
ip domain name laba.ru
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username superuser privilege 15 secret 8 $8$DZEbN6eNx.igzq$i7OoyPa4LGpAG3ePLHzKFRwIZQdQNqBUjMj5Q2FKavY
!
redundancy
!
!
ip ssh maxstartups 3
ip ssh time-out 60
ip ssh authentication-retries 5
ip ssh rsa keypair-name SSH-RemoteControl-KeyPair
ip ssh logging events
ip ssh version 2
ip ssh dh min size 2048
ip ssh server algorithm mac hmac-sha1
ip ssh server algorithm encryption aes256-ctr aes192-ctr
ip ssh client algorithm mac hmac-sha1
ip ssh client algorithm encryption aes256-ctr aes192-ctr
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 description ===[ Loopback interface ]===
 ip address 10.77.0.252 255.255.255.255
!
interface Ethernet0/0
 description ===[ Link: R19 to R14 ]===
 ip address 10.77.0.2 255.255.255.252
 ip ospf 1 area 101
!
interface Ethernet0/1
 no ip address
 shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
router ospf 1
 router-id 10.77.0.252
 area 101 stub no-summary
 network 10.77.0.0 0.0.0.3 area 101
 network 10.77.0.252 0.0.0.0 area 101
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 15 0
 privilege level 15
 logging synchronous
 login local
 transport input ssh
 transport output ssh
!
ntp logging
ntp update-calendar
ntp server 10.77.0.250 source Loopback0
ntp server 10.77.0.251 prefer source Loopback0
!
end
